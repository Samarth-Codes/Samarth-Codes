name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Samarth-Codes

          # Output paths
          outputs: |
            dist/samarth-snake-light.svg
            dist/samarth-snake-dark.svg

          # Light theme version
          svg_out_path: dist/samarth-snake-light.svg
          palette: github-light

      - uses: Platane/snk@v3
        with:
          github_user_name: Samarth-Codes

          # Dark theme version with custom palette
          svg_out_path: dist/samarth-snake-dark.svg
          palette: "[#00FFAA, #00CCFF, #6699FF, #9966FF, #CC66FF, #FF66CC, #FF6699]"

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
