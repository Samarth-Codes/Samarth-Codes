name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Light Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Samarth-Codes
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Generate Dark Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Samarth-Codes
          svg_out_path: dist/github-contribution-grid-snake-dark.svg
          palette: "[#00FFAA, #00CCFF, #6699FF, #9966FF, #CC66FF, #FF66CC, #FF6699]"
          background: "#121212"

      - name: Debug - List dist folder contents
        run: ls -la dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          create_target_branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
